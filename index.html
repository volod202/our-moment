<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наша особлива мить | 24.09.2026</title>
    <!-- Підключення стилів для карти Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        /* Базові налаштування */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comfortaa', 'Georgia', serif;
        }

        body {
            /* Зменшено щільність оверлею з 0.88 до 0.35, щоб чітко проглядався пейзаж */
            background: linear-gradient(to bottom, rgba(252, 248, 242, 0.35), rgba(245, 235, 224, 0.45)), 
                        url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            color: #3b2f25; /* Зроблено колір тексту трохи темнішим для ідеального контрасту на фоні лісу */
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Анімований лагідний листопад */
        #romance-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .leaf-particle {
            position: absolute;
            color: rgba(221, 161, 94, 0.6);
            animation: fallDown linear infinite;
            user-select: none;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(0.7) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.1) translateX(40px);
                opacity: 0;
            }
        }

        /* Головний контент */
        .wrapper {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero {
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .magic-icon {
            font-size: 5rem;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.15));
            animation: gentleSway 3s infinite ease-in-out;
        }

        @keyframes gentleSway {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }

        h1 {
            font-size: 2.6rem;
            letter-spacing: 3px;
            margin-bottom: 25px;
            color: #2b221a;
            /* Біле підсвічування тексту, щоб він легко читався поверх дерев */
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9), 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .quote-box {
            max-width: 650px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.65); /* Додано м'яку підкладку під цитату */
            padding: 20px 30px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .quote-text {
            font-size: 1.45rem;
            line-height: 1.9;
            color: #3b2f25;
            font-style: italic;
        }

        .quote-text span {
            display: block;
            font-weight: bold;
            color: #a65208; /* Більш насичена осіння карамель для чіткості */
            margin-top: 15px;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        /* Секція карти */
        .map-section {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(221, 161, 94, 0.3);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .map-section h2 {
            font-size: 1.4rem;
            color: #2b221a;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        #map {
            width: 100%;
            height: 380px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            z-index: 5;
        }

        .leaflet-popup-content-wrapper {
            background: #ffffff !important;
            color: #3b2f25 !important;
            border: 1px solid #dda15e;
            font-family: 'Comfortaa', serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important;
            padding: 5px;
        }
        
        .map-link {
            display: inline-block;
            margin-top: 8px;
            color: #a65208;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border-bottom: 1px dashed #a65208;
            transition: color 0.2s, border-color 0.2s;
        }

        .map-link:hover {
            color: #dda15e;
            border-color: #dda15e;
        }

        .leaflet-popup-tip {
            background: #ffffff !important;
        }

        /* Мобільна адаптація */
        @media (max-width: 650px) {
            h1 { font-size: 1.9rem; letter-spacing: 1px; }
            .quote-text { font-size: 1.2rem; line-height: 1.7; }
            .quote-text span { font-size: 1.3rem; }
            #map { height: 300px; }
        }
    </style>
</head>
<body>

    <!-- Ефект лагідного осіннього листопада на фоні -->
    <div id="romance-container"></div>

    <div class="wrapper">
        <!-- Головний блок -->
        <section class="hero">
            <div class="magic-icon">🍂</div>
            <h1>НАША ОСОБЛИВА МИТЬ</h1>
            
            <div class="quote-box">
                <p class="quote-text">
                    Один день. Один момент.<br>
                    <span>Один поцілунок, який став особливим</span>
                </p>
            </div>
        </section>

        <!-- Інтерактивна світла карта -->
        <section class="map-section">
            <h2>Місце, де зупинився час 📍</h2>
            <div id="map"></div>
        </section>
    </div>

    <!-- Скрипт карти Leaflet -->
    <script src="https://unpkg.com"></script>
    <script>
        /* Ініціалізація карти за точними координатами */
        const lat = 49.50273278047574;
        const lng = 24.611867272552544;
        
        const map = L.map('map').setView([lat, lng], 15);
        
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        const googleMapsUrl = `https://google.com{lat},${lng}`;

        const marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`
            <div style="text-align: center;">
                <b>Тут відбувся наш особливий поцілунок... ❤️</b><br>
                <a href="${googleMapsUrl}" target="_blank" class="map-link">Відкрити в Google Maps ↗</a>
            </div>
        `).openPopup();

        /* Генератор лагідного листопада */
        const bgContainer = document.getElementById('romance-container');
        const autumnSymbols = ['🍂', '🍁', '✨', '🤎'];

        function spawnLeaf() {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf-particle');
            
            leaf.innerText = autumnSymbols[Math.floor(Math.random() * autumnSymbols.length)];
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.animationDuration = Math.random() * 6 + 8 + 's'; 
            leaf.style.fontSize = Math.random() * 0.6 + 0.8 + 'rem';
            leaf.style.opacity = Math.random() * 0.4 + 0.3;

            bgContainer.appendChild(leaf);
            setTimeout(() => { leaf.remove(); }, 14000);
        }
        setInterval(spawnLeaf, 600);
    </script>
</body>
</html>
